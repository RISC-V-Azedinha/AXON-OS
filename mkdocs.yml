site_name: AXON-OS
site_description: Documentação do AXON RTOS — um sistema operacional de tempo real para RISC-V (RV32I_Zicsr), com suporte a QEMU e a um SoC em FPGA com acelerador NPU.
site_author: nyfeu
repo_name: AXON-OS
repo_url: https://github.com/RISC-V-Azedinha/AXON-OS
edit_uri: edit/main/docs/
copyright: Copyright &copy; AXON-OS

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: material/pencil-circle
      tip: material/lightbulb-on
      warning: material/alert
      danger: material/skull
      info: material/information
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.tooltips
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: Nesta página
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: pt

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RISC-V-Azedinha/AXON-OS

nav:
  - Introdução: index.md
  - Primeiros passos: primeiros-passos.md
  - Arquitetura do kernel:
      - Visão geral e inicialização: arquitetura/visao-geral.md
      - Tarefas e escalonamento: arquitetura/escalonador.md
      - Interrupções e chamadas de sistema: arquitetura/interrupcoes-syscalls.md
      - Gerenciamento de memória: arquitetura/memoria.md
      - Sistema de arquivos: arquitetura/sistema-arquivos.md
      - Plataformas e drivers: arquitetura/plataformas-drivers.md
  - Shell: shell.md
  - Estrutura do código-fonte: codigo-fonte.md
